[project]
name = "vyper-agentic-payments"
version = "0.1.0"
description = "Vyper smart contracts for agentic payment workflows on Circle's Arc chain"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Luca Fumagalli", email = "luca@vyper.dev" }
]
keywords = ["vyper", "ethereum", "arc", "circle", "usdc", "agents", "erc-8004"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "vyper>=0.4.0",
    "titanoboa>=0.2.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "python-dotenv>=1.0.0",
    # circlekit (Python x402 SDK) is required but installed from a local path:
    #   pip install -e ../circle-titanoboa-sdk
    # See: https://github.com/lufa23/circle-titanoboa-sdk
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
]
integration = [
    "flask>=3.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "eth-account>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: tests requiring circlekit SDK (flask server + GatewayClient)",
    "challenge: hackathon challenge verification tests",
    "real_chain: end-to-end tests requiring a live Arc Testnet RPC connection",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["lib/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"challenges/**" = ["F401", "F841", "I001", "E501"]
"tests/**" = ["F401", "F821", "I001", "W291", "W293", "E501"]
"examples/agent-marketplace/server.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["lib/", "contracts/"]
